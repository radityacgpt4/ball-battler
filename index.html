<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Ball - Auto Battler Engine v3 (1v1 / 2v2 / 3v3)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container">
        <div id="ui-header"></div>

        <div id="game-wrapper">
            <canvas id="arena" width="800" height="500"></canvas>

            <div id="char-select" class="screen-overlay">
                <h2 class="setup-title">SELECT YOUR FIGHTER</h2>

                <!-- Game Mode Selector -->
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="1v1">1v1</button>
                    <button class="mode-btn" data-mode="2v2">2v2</button>
                    <button class="mode-btn" data-mode="3v3">3v3</button>
                </div>

                <!-- Mobile Player Toggle -->
                <div class="player-toggle" id="player-toggle">
                    <button class="player-toggle-btn active-p1" id="toggle-p1">PLAYER 1</button>
                    <button class="player-toggle-btn" id="toggle-p2">PLAYER 2</button>
                </div>

                <div class="selection-interface">
                    <!-- Player 1 Detail Panel -->
                    <div class="detail-panel p1-details" id="p1-details">
                        <div class="p-tag p1-tag">PLAYER 1</div>
                        <div class="detail-content">
                            <h3 class="detail-name" id="p1-detail-name">---</h3>
                            <div class="detail-stats" id="p1-detail-stats"></div>
                            <div class="detail-skills" id="p1-detail-skills"></div>
                        </div>
                    </div>

                    <!-- Central Character Grid -->
                    <div class="char-grid-container">
                        <div class="char-grid" id="char-grid"></div>
                    </div>

                    <!-- Player 2 Detail Panel -->
                    <div class="detail-panel p2-details" id="p2-details">
                        <div class="p-tag p2-tag">PLAYER 2</div>
                        <div class="detail-content">
                            <h3 class="detail-name" id="p2-detail-name">---</h3>
                            <div class="detail-stats" id="p2-detail-stats"></div>
                            <div class="detail-skills" id="p2-detail-skills"></div>
                        </div>
                    </div>
                </div>

                <div class="start-container">
                    <div class="sound-toggle">SOUND AUTO-MUTES UNTIL START</div>
                    <button id="start-btn">ENGAGE BATTLE</button>
                </div>
            </div>

            <div id="end-screen" class="screen-overlay">
                <h1 id="win-msg">WINNER</h1>
                <button class="restart-btn" id="restart-btn">SETUP NEW FIGHT</button>
            </div>
        </div>

        <!-- Debug Log Section -->
        <div id="debug-section">
            <div class="debug-controls">
                <button id="debug-toggle">Hide Debug Log</button>
                <button id="debug-copy">Copy Log</button>
            </div>
            <div id="debug-log-container">
                <div id="debug-log-content"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Game } from './src/core/Game.js';

        // Create global game instance
        const game = new Game();

        // Initialize the game
        game.init();

        // Bind button events
        document.getElementById('start-btn').addEventListener('click', () => {
            game.startMatch();
            // Also enable sound on start
            if (game.audio) game.audio.init();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            game.showSelect();
        });

        // Debug Toggle
        const debugToggle = document.getElementById('debug-toggle');
        const debugLogContainer = document.getElementById('debug-log-container');

        debugToggle.addEventListener('click', () => {
            debugLogContainer.classList.toggle('collapsed');
            if (debugLogContainer.classList.contains('collapsed')) {
                debugToggle.textContent = 'Show Debug Log';
            } else {
                debugToggle.textContent = 'Hide Debug Log';
            }
        });

        // Debug Copy
        document.getElementById('debug-copy').addEventListener('click', () => {
            const text = debugLogContent.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const original = document.getElementById('debug-copy').textContent;
                document.getElementById('debug-copy').textContent = 'Copied!';
                setTimeout(() => {
                    document.getElementById('debug-copy').textContent = original;
                }, 2000);
            });
        });

        // Expose game instance for debugging (optional)
        window.game = game;
    </script>
</body>

</html>
